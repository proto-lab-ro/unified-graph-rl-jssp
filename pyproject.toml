[project]
name = "unified-graph-rl-jssp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.3",
    "gymnasium>=1.2.0",
    "hydra-core>=1.3.2",
    "matplotlib>=3.10.3",
    "ortools>=9.14.6206",
    "pyodbc>=5.2.0",
    "pyyaml>=6.0.2",
    "scipy>=1.16.2",
    "seaborn>=0.13.2",
    "tensorboard>=2.20.0",
    "tensordict>=0.9.1",
    "torch-geometric>=2.6.1",
    "torchrl[utils]==0.10.0",
]

[project.optional-dependencies]
azure = [
    "azure-storage-blob>=12.21.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests that take more than a few seconds",
    "gpu: Tests that require GPU",
    "env: Environment-related tests",
    "model: Model-related tests",
    "training: Training-related tests",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    ".venv",
    ".uv_cache",
    "dist",
    "build",
]
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",  # isort compatible import sorting
    "B",  # bugbear
    "UP", # pyupgrade
    "G",  # logging format issues
]
ignore = [
    "E203",  # allow space before colon (black compatibility)
    "E501",  # handled by formatter
    "B007", # allow using set literals,
    "F841", # allow unused variables (for pytest fixtures)
    "B905",
    "G004", # allow use of f-strings in logging
    "F821",
    "G003",
    "E402",
    "E722",
]

[tool.ruff.lint.isort]
known-first-party = ["jssp_core", "jssp_gnn"]
lines-after-imports = 2

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchrl.*",
    "tensordict.*",
    "torch_geometric.*",
    "matplotlib.*",
    "gymnasium.*",
    "yaml.*"
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]

[tool.bandit.assert_used]
skips = ["*_test.py", "*test_*.py"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
    "mypy>=1.0.0",
    "ruff>=0.8.0",
    "pre-commit>=4.2.0",
    "ipykernel>=7.1.0",
    "optuna-dashboard>=0.20.0",
    "azure-storage-blob>=12.27.1",
    "optuna>=4.5.0",
]
