# Pre-commit configuration for JSSP GNN project
# Minimal setup with essential tools only

repos:
  # Built-in hooks - essential only
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=10000']
        exclude: ^examples/benchmark_results.parquet$

  # Ruff handles linting, formatting, and import sorting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      # Run the linter.
      # - id: ruff-check
      #   args: [ --fix ]
      - id: ruff-format

  # Python linting - basic setup
  # - repo: https://github.com/pycqa/flake8
  #   rev: 7.0.0
  #   hooks:
  #     - id: flake8
  #       args: ["--max-line-length=88", "--extend-ignore=E203,W503,E501,F401,F841,E402"]

# Global configuration
default_stages: [pre-commit]
fail_fast: false
